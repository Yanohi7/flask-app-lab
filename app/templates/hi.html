{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}

<style>
    /* Ваші CSS стилі */

    .navbar {
        /* Інші властивості */
        position: relative; /* Видалено фіксоване позиціонування */
        top: auto; /* Видалено властивість top */
        left: auto; /* Видалено властивість left */
    }

    .container {
        margin-left: 0; /* Видалено відступ зліва для контейнера */
    }
</style>

<header>
</header>

<nav class="navbar">
    <ul class="navbar-nav">
        <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('user_name.greetings', name='John', age=40) }}">Greet John</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('user_name.admin') }}">Admin</a>
        </li>
    </ul>
</nav>

<div class="container">
    <h1 class="display-4">Hello :)</h1>
    <h2 class="mt-4">User: {{ name }}</h2>

    {% if age %}
        <h3 class="text-success">Age: {{ age }}</h3>
    {% else %}
        <h3 class="text-danger">Age: Not provided</h3>
    {% endif %}
</div>

{% endblock %}
